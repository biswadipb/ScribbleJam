<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ScribbleJam</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --bg2: var(--tg-theme-secondary-bg-color, #f1f1f4);
    --text: var(--tg-theme-text-color, #111);
    --hint: var(--tg-theme-hint-color, #777);
    --accent: var(--tg-theme-button-color, #2f80ed);
    --accent-text: var(--tg-theme-button-text-color, #fff);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg2); color: var(--text); font: 15px system-ui, sans-serif; overscroll-behavior: none; }
  #app { display: flex; flex-direction: column; height: 100%; padding-bottom: env(safe-area-inset-bottom); }
  .bar { display: flex; align-items: center; gap: 6px; padding: 8px 10px; background: var(--bg); }
  .bar .sp { flex: 1; }
  .badge { font-size: 12px; color: var(--hint); }
  button { font: inherit; color: var(--text); background: var(--bg2); border: 0; border-radius: 10px; padding: 8px 12px; cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-text); }
  button.on { outline: 2px solid var(--accent); }
  #stage { flex: 1; min-height: 0; display: grid; place-items: center; padding: 8px; }
  #wrap { position: relative; touch-action: none; box-shadow: 0 1px 8px rgba(0,0,0,.18); background: #fff; }
  #wrap.transparent {
    background-color: #fff;
    background-image: linear-gradient(45deg,#ddd 25%,transparent 25%,transparent 75%,#ddd 75%),
                      linear-gradient(45deg,#ddd 25%,transparent 25%,transparent 75%,#ddd 75%);
    background-size: 20px 20px; background-position: 0 0, 10px 10px;
  }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .tools { background: var(--bg); padding: 8px 10px 10px; display: grid; gap: 8px; }
  .row { display: flex; gap: 6px; align-items: center; }
  .row.scroll { overflow-x: auto; }
  .tool { flex: 1; font-size: 20px; padding: 6px 0; display: grid; justify-items: center; line-height: 1.2; }
  .tool small { font-size: 10px; color: var(--hint); }
  #sizeLabel { font-size: 12px; color: var(--hint); min-width: 92px; text-transform: capitalize; }
  .sw { width: 28px; height: 28px; flex: none; border-radius: 50%; border: 2px solid var(--bg2); padding: 0; }
  .sw.sel { outline: 2px solid var(--accent); outline-offset: 1px; }
  .custom { position: relative; overflow: hidden; background: conic-gradient(red, yellow, lime, cyan, blue, magenta, red); }
  .custom input { position: absolute; inset: -10px; opacity: 0; width: 60px; height: 60px; cursor: pointer; }
  input[type=range] { flex: 1; accent-color: var(--accent); }
  #dot { width: 34px; height: 34px; display: grid; place-items: center; flex: none; }
  #dot i { display: block; border-radius: 50%; background: var(--text); }
  .sw.checker { background-color: #fff; background-image: linear-gradient(45deg,#ccc 25%,transparent 25%,transparent 75%,#ccc 75%), linear-gradient(45deg,#ccc 25%,transparent 25%,transparent 75%,#ccc 75%); background-size: 10px 10px; background-position: 0 0, 5px 5px; }
  .sizes { display: flex; gap: 8px; flex-wrap: wrap; }
  .csize { flex: 1 1 28%; display: grid; justify-items: center; gap: 4px; padding: 10px 4px; text-align: center; font-size: 12px; }
  .csize i { display: block; border: 2px solid currentColor; border-radius: 3px; opacity: .75; }
  .csize.sel { outline: 2px solid var(--accent); }
  #csheet h4 { margin: 6px 0 0; font-size: 13px; color: var(--hint); font-weight: 600; }
  #sheet, #csheet { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: flex-end; }
  #sheet.show, #csheet.show { display: flex; }
  #sheet .card, #csheet .card { background: var(--bg); width: 100%; border-radius: 16px 16px 0 0; padding: 14px; display: grid; gap: 8px; padding-bottom: calc(14px + env(safe-area-inset-bottom)); }
  #sheet h3, #csheet h3 { margin: 0 0 4px; }
  #sheet button { text-align: left; padding: 12px; }
  #sheet .card { max-height: 92vh; overflow-y: auto; }
  label.tag { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--hint); padding: 2px 2px 6px; }
  #csheet .sw { width: 34px; height: 34px; }
  #toast { position: fixed; left: 50%; top: 60px; transform: translateX(-50%); background: #222; color: #fff; padding: 8px 14px; border-radius: 20px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90%; text-align: center; }
  #toast.show { opacity: 1; }

  #boot { position: fixed; inset: 0; z-index: 50; display: none; place-items: center; text-align: center; background: #fffdf6;
    background-image: linear-gradient(#cfe3ee 1px, transparent 1px), linear-gradient(90deg, #cfe3ee 1px, transparent 1px); background-size: 28px 28px;
    color: #22223b; transition: opacity .35s; font-family: 'Marker Felt', 'Chalkboard SE', 'Comic Sans MS', sans-serif; }
  #boot.show { display: grid; }
  #boot.out { opacity: 0; pointer-events: none; }
  #boot h1 { margin: 0; font-size: clamp(40px, 13vw, 76px); letter-spacing: 1px; }
  #boot h1 span { display: inline-block; animation: hop 1.3s ease-in-out infinite; }
  #boot h1 span:nth-child(3n) { color: #e63946; } #boot h1 span:nth-child(3n+1) { color: #22223b; } #boot h1 span:nth-child(3n+2) { color: #2a9d8f; }
  @keyframes hop { 0%, 55%, 100% { transform: translateY(0) } 25% { transform: translateY(-14px) rotate(-4deg) } }
  #boot svg { width: min(78vw, 420px); height: 30px; display: block; margin: 4px auto 14px; }
  #boot svg path { stroke-dasharray: 1; animation: scrawl 1.8s ease-in-out infinite; }
  @keyframes scrawl { 0% { stroke-dashoffset: 1 } 60%, 100% { stroke-dashoffset: 0 } }
  #bootmsg { font-size: 19px; color: #4a4e69; min-height: 26px; padding: 0 20px; }
  #boot button { margin-top: 14px; background: #22223b; color: #fff; }
  .sparks i { position: absolute; font-style: normal; font-size: 30px; animation: float 3.4s ease-in-out infinite; }
  @keyframes float { 50% { transform: translateY(-12px) rotate(10deg) } }
</style>
</head>
<body>
<div id="app">
  <div class="bar">
    <button id="undo" title="Undo">↩️</button>
    <button id="clear" title="Clear">🗑️</button>
    <button id="bg" title="Canvas size and colour">🖼️ Canvas</button>
    <span class="sp"></span>
    <span class="badge" id="mode"></span>
    <button id="share" class="primary">Finish ✓</button>
  </div>
  <div id="stage"><div id="wrap"><canvas id="cv" width="1024" height="1024"></canvas></div></div>
  <div class="tools">
    <div class="row" id="toolrow">
      <button class="tool on" data-tool="pencil" title="Pencil">✏️<small>Pencil</small></button>
      <button class="tool" data-tool="pen" title="Pen">🖊️<small>Pen</small></button>
      <button class="tool" data-tool="brush" title="Brush">🖌️<small>Brush</small></button>
      <button class="tool" data-tool="fill" title="Paint bucket">🪣<small>Bucket</small></button>
      <button class="tool" data-tool="eraser" title="Eraser">🧽<small>Eraser</small></button>
    </div>
    <div class="row scroll" id="palette"></div>
    <div class="row"><div id="dot"><i></i></div><input id="size" type="range" min="1" max="60" value="6"><span id="sizeLabel"></span></div>
  </div>
</div>

<div id="sheet"><div class="card">
  <h3>Finished? 🎉</h3>
  <label class="tag"><input type="checkbox" id="tagToggle" checked> Add a small “Drawn with ScribbleJam by …” credit</label>
  <button data-act="print">🖼️ Send picture to this chat</button>
  <button data-act="forward">↗️ Send to another chat…</button>
  <button data-act="apps">📤 Share to other apps…</button>
  <button data-act="save">💾 Save image</button>
  <button data-act="story">📱 Post to my story</button>
  <button data-act="sticker-white">🏷️ Make a sticker (with canvas colour)</button>
  <button data-act="sticker-clear">🏷️ Make a sticker (no background)</button>
  <button data-act="close">Keep drawing</button>
</div></div>
<div id="csheet"><div class="card">
  <h3>Canvas 🖼️</h3>
  <h4>Size</h4>
  <div class="sizes">
    <button class="csize" data-size="square"><i style="width:26px;height:26px"></i>Square<br>standard</button>
    <button class="csize" data-size="portrait"><i style="width:21px;height:28px"></i>Portrait<br>3:4</button>
    <button class="csize" data-size="landscape"><i style="width:28px;height:21px"></i>Landscape<br>4:3</button>
    <button class="csize" data-size="wide"><i style="width:32px;height:18px"></i>Wide<br>16:9</button>
    <button class="csize" data-size="story"><i style="width:16px;height:28px"></i>Story<br>9:16</button>
  </div>
  <h4>Colour</h4>
  <div class="row scroll" id="cpalette"></div>
  <button data-act="done" class="primary">Done</button>
</div></div>
<div id="boot"><div>
  <div class="sparks"><i style="left:12%;top:16%">⭐</i><i style="right:14%;top:22%;animation-delay:.6s">✏️</i><i style="left:16%;bottom:18%;animation-delay:1.1s">🎨</i><i style="right:12%;bottom:14%;animation-delay:1.7s">🖍️</i></div>
  <h1 id="bootTitle"></h1>
  <svg viewBox="0 0 420 30"><path pathLength="1" d="M8 18 q100 -16 205 0 t200 -4" fill="none" stroke="#e63946" stroke-width="7" stroke-linecap="round"/></svg>
  <div id="bootmsg">Sharpening pencils…</div>
  <button id="bootRetry" hidden>Try again</button>
</div></div>
<div id="toast"></div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
